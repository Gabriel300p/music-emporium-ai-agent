[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent-artefact"
version = "0.1.0"
description = "Read-only customer support agent: CSV tools + PDF policy retrieval + LLM"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<4.0", "pypdf>=5.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<11"]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
