[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent-artefact"
version = "1.0.0"
description = "Read-only AI support agent using structured CSV tools and cited policy PDF retrieval"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<4.0", "pypdf>=5.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<11", "reportlab>=4.0,<5.0"]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The page is HTML/CSS/JS inside a Python string: long lines are inherent to it.
"src/emporio_agent/web_page.py" = ["E501"]
# Tests and scripts favour short one-line helpers and literal data over line length.
"tests/*" = ["E501", "E701", "E702", "E731"]
"scripts/*" = ["E501", "E701", "E702", "E731", "E401", "E402"]
