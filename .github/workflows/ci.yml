name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  lint-e-cobertura:
    name: Lint e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" ruff coverage
      - run: ruff check .
      - run: coverage run --source=src/emporio_agent -m pytest -q
      - run: coverage report --show-missing --fail-under=85

  lancador-windows:
    name: Lançador run.bat (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abrir o programa pelo run.bat e conversar no modo offline
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'run.bat --no-browser --port 8799' `
            -RedirectStandardOutput "$PWD\run-out.log" -RedirectStandardError "$PWD\run-err.log" -PassThru -NoNewWindow
          $config = $null
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 2
            try { $config = Invoke-RestMethod -Uri http://127.0.0.1:8799/api/config -TimeoutSec 3; break } catch { }
            if ($proc.HasExited) { break }
          }
          Write-Host '--- saída do run.bat'
          Get-Content run-out.log, run-err.log -ErrorAction SilentlyContinue
          if (-not $config) { throw 'run.bat não colocou o servidor no ar.' }
          if ($config.default_source -ne 'public') { throw "fonte padrão inesperada: $($config.default_source)" }
          $body = @{ session = 'aaaaaaaaaaaaaaaa'; message = 'Quanto custa o Takamine GD20?'; mode = 'offline'; model = ''; data = 'public' } | ConvertTo-Json
          $reply = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8799/api/chat -ContentType 'application/json; charset=utf-8' -Body $body
          Write-Host "resposta: $($reply.reply)"
          if ($reply.reply -notmatch '2\.199') { throw 'a resposta não trouxe o preço esperado.' }
          taskkill /PID $proc.Id /T /F | Out-Null
